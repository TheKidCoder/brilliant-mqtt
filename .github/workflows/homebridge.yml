name: Homebridge
on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: homebridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: homebridge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI starts from the built package
        run: node dist/cli/main.js --help

  agent-contract:
    # The plugin's fixtures must match what the agent's own code renders.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.10
      - run: uv sync
      - run: uv run python homebridge/scripts/gen_fixtures.py --check
